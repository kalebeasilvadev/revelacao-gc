[project]
name = "revelacao-gc"
version = "1.0.0"
description = "Aplicativo desktop para a revelação dos novos GCs na multiplicação"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "python-multipart>=0.0.20",
    "pywebview>=5.4",
    "pywebview[qt]>=5.4; sys_platform == 'linux'",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.16",
    "httpx>=0.28",
]

[tool.uv]
package = false
