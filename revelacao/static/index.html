<!doctype html>
<html lang="pt-BR" data-tema="matrix">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Revelação dos GCs</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Palco temático: cada tema redefine os tokens abaixo; o fundo animado roda num canvas fixo atrás das telas */
:root,[data-tema=matrix]{
  color-scheme:dark;
  --bg:#020703; --bg2:#030a05; --panel:#06140b; --line:#124a26; --tx:#c9ffd9; --mut:#5fae7b; --nm:#eafff0;
  --ac:#39ff7a; --ac2:#00b347; --ok:#39ff7a; --danger:#ff6b6b; --on-ac:#00170a;
  --ov:rgba(1,6,2,.8); --mix:30%;
  --fd:"Share Tech Mono",ui-monospace,Menlo,monospace; --fb:"IBM Plex Mono",ui-monospace,Menlo,monospace; --fh:"Share Tech Mono",ui-monospace,monospace;
  --ds:1.3; --hz:1.35; --tt:uppercase; --ls:.1em; --rad:0px; --avr:0px;
  --hsh:0 0 16px color-mix(in srgb,var(--ac) 60%,transparent); --gl:14px; --fsh:0 0 0 1px #000;
  --in:var(--ac); --inbg:rgba(0,0,0,.72); --prompt:">"; --inpl:64px; --f1:#05190c; --f2:#010603;
  --bbg:transparent; --btx:var(--ac); --bbd:var(--ac); --bsh:0 0 24px color-mix(in srgb,var(--ac) 35%,transparent);
  --fxo:.55;
}
[data-tema=tech]{
  color-scheme:dark;
  --bg:#040814; --bg2:#070d1c; --panel:#0b1428; --line:#1d3760; --tx:#e6f3ff; --mut:#86a3c9; --nm:#ffffff;
  --ac:#3cc8ff; --ac2:#7b5cff; --ok:#4dffd2; --danger:#ff5c7a; --on-ac:#021018;
  --ov:rgba(3,7,18,.82); --mix:35%;
  --fd:"Orbitron",system-ui,sans-serif; --fb:"Exo 2",system-ui,sans-serif; --fh:"Orbitron",system-ui,sans-serif;
  --ds:1.05; --hz:1.1; --tt:uppercase; --ls:.14em; --rad:3px; --avr:50%;
  --hsh:0 0 24px color-mix(in srgb,var(--ac) 55%,transparent); --gl:18px; --fsh:0 0 0 1px color-mix(in srgb,var(--ac) 35%,transparent);
  --in:var(--tx); --inbg:rgba(10,25,50,.6); --prompt:"›"; --inpl:60px; --f1:#0d1b38; --f2:#060b19;
  --bbg:color-mix(in srgb,var(--ac) 12%,transparent); --btx:var(--ac); --bbd:var(--ac); --bsh:0 0 30px color-mix(in srgb,var(--ac) 35%,transparent);
  --fxo:.75;
}
[data-tema=arcade]{
  color-scheme:dark;
  --bg:#07051a; --bg2:#0c0924; --panel:#141036; --line:#2b2470; --tx:#eef0ff; --mut:#9a97cc; --nm:#ffffff;
  --ac:#FFE14D; --ac2:#ff2bd6; --ok:#3dff9a; --danger:#ff4d6d; --on-ac:#1a1400;
  --ov:rgba(5,4,15,.92); --mix:45%;
  --fd:"Press Start 2P",ui-monospace,monospace; --fb:"Chakra Petch",system-ui,sans-serif; --fh:"Press Start 2P",ui-monospace,monospace;
  --ds:1; --hz:1; --tt:uppercase; --ls:.04em; --rad:4px; --avr:4px;
  --hsh:0 0 14px color-mix(in srgb,var(--ac) 70%,transparent),4px 4px 0 var(--ac2); --gl:18px; --fsh:0 0 0 4px #000;
  --in:var(--ok); --inbg:rgba(0,0,0,.55); --prompt:">"; --inpl:64px; --f1:#1d1650; --f2:#0d0a2a;
  --bbg:var(--ac); --btx:var(--on-ac); --bbd:var(--ac); --bsh:0 0 30px color-mix(in srgb,var(--ac) 60%,transparent),4px 4px 0 var(--ac2);
  --fxo:1;
}
[data-tema=gala]{
  color-scheme:dark;
  --bg:#0c0a08; --bg2:#14100c; --panel:#1c1712; --line:#3d3123; --tx:#f6efe3; --mut:#b5a68e; --nm:var(--ac);
  --ac:#e2b866; --ac2:#9c6b2f; --ok:#a8d8a0; --danger:#e8806a; --on-ac:#1c1408;
  --ov:rgba(10,8,6,.86); --mix:26%;
  --fd:"Cormorant Garamond",Georgia,serif; --fb:"Manrope",system-ui,sans-serif; --fh:"Manrope",system-ui,sans-serif;
  --ds:1.9; --hz:1.15; --tt:none; --ls:.22em; --rad:14px; --avr:50%;
  --hsh:0 2px 30px color-mix(in srgb,var(--ac) 30%,transparent); --gl:0px; --fsh:0 10px 40px rgba(0,0,0,.5);
  --in:var(--tx); --inbg:rgba(255,255,255,.04); --prompt:""; --inpl:24px; --f1:#251d15; --f2:#110d09;
  --bbg:transparent; --btx:var(--ac); --bbd:transparent; --bsh:none;
  --fxo:.9;
}
[data-tema=claro]{
  color-scheme:light;
  --bg:#f3f5fa; --bg2:#eceff6; --panel:#ffffff; --line:#d6dbe8; --tx:#131a2c; --mut:#5b6580; --nm:var(--tx);
  --ac:#2f54eb; --ac2:#ff6b4a; --ok:#11804c; --danger:#d23a3a; --on-ac:#ffffff;
  --ov:rgba(243,245,250,.95); --mix:20%;
  --fd:"Bricolage Grotesque",system-ui,sans-serif; --fb:"Manrope",system-ui,sans-serif; --fh:"Manrope",system-ui,sans-serif;
  --ds:1.6; --hz:1.15; --tt:none; --ls:.16em; --rad:16px; --avr:50%;
  --hsh:none; --gl:0px; --fsh:0 12px 34px rgba(19,26,44,.14);
  --in:var(--tx); --inbg:#ffffff; --prompt:""; --inpl:24px; --f1:#ffffff; --f2:#e8ecf6;
  --bbg:var(--ac); --btx:var(--on-ac); --bbd:var(--ac); --bsh:0 10px 30px color-mix(in srgb,var(--ac) 30%,transparent);
  --fxo:0;
}

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font-family:var(--fb);overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}

#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:var(--fxo)}
body:not(.palco) #fx{display:none}
.screen{position:relative;z-index:1;min-height:100vh;padding-top:52px}
body.present .screen{padding-top:0}
html[data-tema=arcade] body.palco::after,html[data-tema=matrix] body.palco::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:250;background:repeating-linear-gradient(0deg,rgba(0,0,0,.2) 0 1px,transparent 1px 3px)}

nav{position:fixed;inset:0 0 auto 0;height:52px;display:flex;align-items:center;gap:6px;padding:0 16px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);z-index:50}
nav .brand{font-family:var(--fh);font-size:calc(11px * var(--hz));letter-spacing:var(--ls);text-transform:uppercase;color:var(--ac);margin-right:12px;white-space:nowrap}
nav button{background:none;border:1px solid transparent;border-radius:4px;padding:6px 12px;cursor:pointer;color:var(--mut);white-space:nowrap}
nav button.on{color:var(--tx);border-color:var(--line);background:var(--panel)}
nav .keys{margin-left:auto;font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.present nav{display:none}

.btn{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:8px 14px;cursor:pointer}
.btn:hover{border-color:var(--mut)}
.btn.pri{background:var(--ac);color:var(--on-ac);border-color:var(--ac);font-weight:700}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.ghost{background:none}
.btn.danger{color:var(--danger)}

/* ---------- admin ---------- */
#admin{background:var(--bg2)}
.adm{max-width:1100px;margin:0 auto;padding:24px 16px 80px}
.adm h2{font-family:var(--fh);font-size:calc(13px * var(--hz));letter-spacing:var(--ls);text-transform:uppercase;line-height:1.5;margin:36px 0 14px;color:var(--ac)}
.adm h2:first-child{margin-top:8px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px}
.adm label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
.adm input:not([type=color]):not([type=checkbox]),.adm select,.adm textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:8px 10px}
.adm textarea{min-height:110px;font-family:ui-monospace,Menlo,monospace;font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:160px}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.gc-ed{border-top:4px solid var(--c)}
.gc-ed input[type=color]{width:42px;height:38px;border:none;background:none;padding:0;cursor:pointer}
.lid-ed{margin-top:8px;flex-wrap:nowrap}
.lid-ed .grow{min-width:0}
.mf{display:flex;align-items:center;gap:6px}
.mf img,.mf video,.mf .ph{width:48px;height:48px;border-radius:4px;object-fit:cover;background:var(--bg);border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--mut);text-align:center}
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:12px;color:var(--mut);font-weight:600;padding:6px}
.tbl td{padding:6px;border-top:1px solid var(--line);vertical-align:middle}
.tbl-wrap{overflow-x:auto}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--bg);color:var(--mut);white-space:nowrap}
.tag.ok{color:var(--ok)}
.note{font-size:13px;color:var(--mut);margin:6px 0 0}
.savestate{position:fixed;right:16px;bottom:16px;font-size:12px;color:var(--mut);background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:6px 12px;z-index:260}

.temas{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.tema-card{all:unset;box-sizing:border-box;cursor:pointer;background:radial-gradient(260px 140px at 50% 0%,color-mix(in srgb,var(--ac) 18%,transparent),transparent 70%),var(--bg);color:var(--tx);border:2px solid var(--line);border-radius:10px;padding:16px 14px;display:flex;flex-direction:column;gap:10px;min-height:168px}
.tema-card:hover{border-color:var(--mut)}
.tema-card:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.tema-card.on{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 35%,transparent)}
.tema-card .tp{font-family:var(--fd);font-size:calc(11px * var(--ds));line-height:1.3;text-transform:var(--tt);color:var(--ac);text-shadow:var(--hsh);min-height:2.6em}
.tema-card .sw{display:flex;gap:5px}
.tema-card .sw i{width:16px;height:16px;border-radius:var(--avr);border:1px solid var(--line)}
.tema-card b{font-family:var(--fb);font-size:15px}
.tema-card small{color:var(--mut);font-family:var(--fb);font-size:12px;line-height:1.4}
.tema-card .sel{font-size:11px;color:var(--ac);font-family:var(--fb);visibility:hidden}
.tema-card.on .sel{visibility:visible}

/* ---------- palco ---------- */
.synth{position:relative;overflow:hidden;isolation:isolate}
html[data-tema=arcade] .synth::before{content:"";position:absolute;left:-50%;right:-50%;bottom:-6%;height:52%;z-index:-1;pointer-events:none;
  background-image:linear-gradient(color-mix(in srgb,var(--ac2) 55%,transparent) 2px,transparent 2px),linear-gradient(90deg,color-mix(in srgb,var(--ac2) 55%,transparent) 2px,transparent 2px);
  background-size:64px 64px;transform:perspective(420px) rotateX(62deg);transform-origin:top;animation:grid 1.6s linear infinite;
  -webkit-mask-image:linear-gradient(transparent,#000 45%);mask-image:linear-gradient(transparent,#000 45%);opacity:.45}
@keyframes grid{to{background-position:0 64px}}
.stage{min-height:calc(100vh - 52px);background:radial-gradient(900px 500px at 50% 0%,color-mix(in srgb,var(--ac) 14%,transparent),transparent 70%),radial-gradient(700px 400px at 50% 100%,color-mix(in srgb,var(--ac2) 16%,transparent),transparent 70%);display:flex;flex-direction:column;align-items:center;padding:48px 16px 32px;text-align:center}
body.present .stage{min-height:100vh}
.stage .logo{max-height:72px;max-width:220px;margin-bottom:12px}
.kicker{font-family:var(--fh);font-size:calc(11px * var(--hz));letter-spacing:var(--ls);text-transform:uppercase;color:var(--ac);text-shadow:0 0 var(--gl) var(--ac)}
.stage h1{font-family:var(--fd);font-size:calc(clamp(20px,3.8vw,50px) * var(--ds));line-height:1.2;margin:18px 0 10px;font-weight:700;color:var(--ac);text-shadow:var(--hsh);text-transform:var(--tt);text-wrap:balance}
html[data-tema=arcade] .stage h1{font-weight:400}
.sub{color:var(--mut);font-size:clamp(15px,1.6vw,20px)}
.blink{animation:blink 1s steps(2,start) infinite}
@keyframes blink{to{visibility:hidden}}
html[data-tema=gala] .blink,html[data-tema=claro] .blink{animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{opacity:.35}}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:22px;width:min(1200px,100%);margin-top:40px;perspective:1400px}
.card{height:300px;cursor:pointer;position:relative}
.card .in{position:absolute;inset:0;transition:transform .8s cubic-bezier(.3,1.3,.4,1);transform-style:preserve-3d}
.card.flip .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:var(--rad);backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:18px;overflow:hidden}
.front{background:linear-gradient(160deg,var(--f1),var(--f2));border:2px solid var(--line);box-shadow:var(--fsh)}
.front .q{font-family:var(--fd);font-size:min(calc(72px * var(--ds)),118px);line-height:1;color:var(--ac);text-shadow:var(--hsh);animation:bob 1.4s ease-in-out infinite}
.front .n,.front .ps{font-family:var(--fh);font-size:calc(10px * var(--hz));letter-spacing:var(--ls);text-transform:uppercase;color:var(--mut)}
.front .ps{color:var(--ac);visibility:hidden}
.card.next .front{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac),0 0 40px color-mix(in srgb,var(--ac) 40%,transparent)}
.card.next .ps{visibility:visible;animation:blink 1s steps(2,start) infinite}
@keyframes bob{50%{transform:translateY(-10px)}}
.back{transform:rotateY(180deg);background:linear-gradient(160deg,color-mix(in srgb,var(--c) 75%,#000),color-mix(in srgb,var(--c) 18%,#05050a));border:2px solid var(--c);box-shadow:0 0 30px color-mix(in srgb,var(--c) 45%,transparent) inset;color:#fff}
.back img{width:100%;height:110px;object-fit:cover;border-radius:var(--rad)}
.back .gn{font-family:var(--fd);font-size:calc(16px * var(--ds));line-height:1.25;font-weight:700;text-transform:var(--tt);text-shadow:0 0 var(--gl) var(--c)}
.back .gl{font-size:15px;opacity:.92}
.stage-tools{position:fixed;right:16px;bottom:16px;display:flex;gap:8px;opacity:.35;transition:opacity .2s;z-index:30}
.stage-tools:hover{opacity:1}

/* busca */
.searchbox{margin-top:42px;width:min(760px,100%);position:relative}
.searchbox::before{content:var(--prompt);position:absolute;left:24px;top:50%;transform:translateY(-50%);font-family:var(--fd);font-size:clamp(18px,2.4vw,30px);color:var(--in);text-shadow:0 0 var(--gl) var(--in)}
.searchbox input{width:100%;font-family:var(--fd);font-size:calc(clamp(14px,2.2vw,26px) * min(var(--ds),1.4));padding:24px 24px 24px var(--inpl);border-radius:var(--rad);background:var(--inbg);border:2px solid var(--line);outline:none;color:var(--in);text-shadow:0 0 calc(var(--gl) / 2) color-mix(in srgb,var(--in) 60%,transparent);text-transform:var(--tt);caret-color:var(--in);box-shadow:var(--fsh)}
.searchbox input::placeholder{color:color-mix(in srgb,var(--in) 35%,transparent);text-shadow:none}
.searchbox input:focus{border-color:var(--in);box-shadow:0 0 0 4px color-mix(in srgb,var(--in) 16%,transparent),0 0 40px color-mix(in srgb,var(--in) 18%,transparent)}
.hint{font-family:var(--fh);font-size:calc(11px * var(--hz));letter-spacing:var(--ls);text-transform:uppercase;color:var(--ac);margin-top:20px}
.msg{margin-top:24px;font-size:20px;min-height:30px}
.msg.err{color:var(--danger)}
.choices{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:14px}
.choices button{font-size:20px;padding:12px 22px;border-radius:var(--rad);background:var(--panel);border:2px solid var(--line);cursor:pointer}
.choices button:hover,.choices button:focus-visible{border-color:var(--ac);box-shadow:0 0 18px color-mix(in srgb,var(--ac) 35%,transparent)}
.xp{margin-top:auto;padding-top:40px;width:min(640px,100%);display:grid;grid-template-columns:1fr auto;gap:8px 14px;align-items:center;text-align:left}
.xp-l{font-family:var(--fh);font-size:calc(9px * var(--hz));letter-spacing:var(--ls);text-transform:uppercase;color:var(--mut);grid-column:1/-1}
.xp-bar{height:16px;border:2px solid var(--ac);padding:2px;border-radius:var(--rad);box-shadow:0 0 14px color-mix(in srgb,var(--ac) 30%,transparent)}
.xp-bar i{display:block;height:100%;border-radius:calc(var(--rad) / 2);background:var(--ac);transition:width 1s}
html[data-tema=arcade] .xp-bar i,html[data-tema=matrix] .xp-bar i{background:repeating-linear-gradient(90deg,var(--ac) 0 10px,transparent 10px 13px)}
.xp-n{font-family:var(--fh);font-size:calc(12px * var(--hz));color:var(--ac);font-variant-numeric:tabular-nums}

/* painel */
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;width:min(1300px,100%);margin-top:36px;text-align:left}
.col{background:color-mix(in srgb,var(--panel) 80%,transparent);border:2px solid var(--c);border-radius:var(--rad);overflow:hidden;box-shadow:0 0 26px color-mix(in srgb,var(--c) 25%,transparent)}
.col h3{margin:0;padding:16px;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 70%,#000),color-mix(in srgb,var(--c) 30%,transparent));color:#fff;font-family:var(--fd);font-size:calc(14px * var(--ds));line-height:1.3;text-transform:var(--tt);text-shadow:0 0 var(--gl) var(--c)}
.col .ld{font-size:14px;padding:8px 16px;color:var(--mut)}
.col .hp{display:flex;align-items:center;gap:10px;padding:0 16px 10px;border-bottom:1px solid var(--line)}
.col .hp div{flex:1;height:10px;border:1px solid var(--c);padding:1px;border-radius:var(--rad)}
.col .hp i{display:block;height:100%;background:var(--c);border-radius:var(--rad)}
.col .hp span{font-family:var(--fh);font-size:calc(9px * var(--hz));color:var(--mut);font-variant-numeric:tabular-nums}
.col ul{list-style:none;margin:0;padding:8px 16px 16px}
.col li{padding:8px 0;border-bottom:1px solid color-mix(in srgb,var(--tx) 8%,transparent);display:flex;align-items:center;gap:10px;font-size:16px;animation:up .5s both}
.col li.pend{opacity:.35}

/* overlays */
.ov{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
#spot{background:radial-gradient(900px 600px at 50% 40%,color-mix(in srgb,var(--c) var(--mix),transparent),transparent 75%),var(--ov);cursor:pointer}
#vid{background:#000}
#vid video{max-width:100%;max-height:100%}
#vid .skip{position:absolute;right:20px;bottom:20px;color:#fff8;font-size:13px}
#flash{position:fixed;inset:0;background:var(--ac);pointer-events:none;z-index:240;opacity:0}
html[data-tema=arcade] #flash,html[data-tema=claro] #flash{background:#fff}
#flash.go{animation:flash .55s ease-out}
@keyframes flash{0%{opacity:.85}100%{opacity:0}}
.shake{animation:shake .5s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translate(-2px,1px)}20%,80%{transform:translate(5px,-2px)}30%,50%,70%{transform:translate(-9px,3px)}40%,60%{transform:translate(9px,-3px)}}
html[data-tema=gala] .shake,html[data-tema=claro] .shake{animation:none}

#vs{background:radial-gradient(800px 500px at 50% 50%,color-mix(in srgb,var(--c) 18%,transparent),transparent 70%),var(--ov);--c:var(--ac)}
.vs-wrap{display:grid;grid-template-columns:1fr auto 1fr;gap:clamp(16px,4vw,60px);align-items:center;width:min(1200px,100%)}
.vs-side{display:flex;flex-direction:column;align-items:center;gap:16px}
.vs-tag{font-family:var(--fh);font-size:calc(12px * var(--hz));letter-spacing:var(--ls);text-transform:uppercase;color:var(--mut)}
.frame{width:clamp(150px,22vw,280px);aspect-ratio:1;max-width:100%;border:4px solid var(--fc,var(--ac));border-radius:var(--rad);background:var(--panel);box-shadow:var(--fsh),0 0 calc(var(--gl) * 2) var(--fc,var(--ac));display:flex;align-items:center;justify-content:center;overflow:hidden}
.frame img{width:100%;height:100%;object-fit:cover}
.frame span{font-family:var(--fd);font-size:calc(clamp(28px,4vw,56px) * min(var(--ds),1.4));color:var(--fc,var(--ac))}
.vs-name{font-family:var(--fd);font-size:calc(clamp(12px,1.5vw,18px) * var(--ds));line-height:1.4;text-transform:var(--tt)}

  </div>

<script>
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const reduz = matchMedia('(prefers-reduced-motion: reduce)').matches;
const MODO = new URLSearchParams(location.search).get('modo') || 'solo';
const CLIENTE = uid('cli');
document.body.dataset.modo = MODO;

/* ================= temas ================= */
const TEMAS = {
  matrix: {
    nome: 'Matrix', desc: 'Chuva de código verde e o destino sendo decodificado letra por letra.',
    fx: 'rain', mono: '#39ff7a', decode: true, pixel: false, wave: 'sine', tick: 1400,
    charset: 'アイウエオカキクケコサシスセソタチツテトナニヌネ0123456789',
    confete: ['#39ff7a', '#00b347', '#c9ffd9', '#eafff0'], amostra: ['#020703', '#39ff7a', '#00b347', '#c9ffd9'],
    txt: { revela: 'Novos GCs', start: '> executar_', badgeGc: 'Acesso concedido', badgeCasal: 'Destino decodificado', hint: '> aguardando entrada_',
      ph: 'nome_do_casal', p1: 'Usuário', p2: 'Destino', mid: '>>', match: 'Decodificado', painel: 'Rede de GCs', prog: 'Casais sincronizados', fechar: 'Enter para continuar', seta: '→' },
  },

    charset: '01<>/\\{}[]#$%&ABCDEF',
    confete: ['#3cc8ff', '#7b5cff', '#4dffd2', '#ffffff'], amostra: ['#040814', '#3cc8ff', '#7b5cff', '#4dffd2'],
    txt: { revela: 'Novos GCs', start: 'Iniciar', badgeGc: 'Novo GC identificado', badgeCasal: 'Análise concluída', hint: 'Digite o nome e pressione Enter',
      ph: 'nome do casal', p1: 'Perfil', p2: 'Destino', mid: '→', match: 'Confirmado', painel: 'Painel dos GCs', prog: 'Progresso da multiplicação', fechar: 'Enter para continuar', seta: '→' },
  },
  arcade: {
    nome: 'Arcade', desc: 'Fliperama neon com tela VS, contagem e efeitos 8-bit.',
    fx: null, mono: null, decode: false, pixel: true, wave: 'square', tick: 660,
    confete: ['#FFE14D', '#ff2bd6', '#22e1ff', '#ffffff'], amostra: ['#07051a', '#FFE14D', '#ff2bd6', '#3dff9a'],
    txt: { revela: 'Novos GCs', start: 'Press start', badgeGc: 'Novo GC desbloqueado!', badgeCasal: 'Destino desbloqueado!', hint: 'Insert coin · aperte Enter',
      ph: 'nome do casal', p1: 'Player', p2: 'Destino', mid: 'VS', match: 'Match!', painel: 'Placar dos GCs', prog: 'Progresso da multiplicação', fechar: 'Pressione Enter ▶', seta: '▶' },
  },
  gala: {
    nome: 'Gala', desc: 'Preto e dourado, brilhos subindo e tipografia clássica.',
    fx: 'sparkle', mono: '#e2b866', decode: false, pixel: false, wave: 'sine', tick: 1900,
    confete: ['#e2b866', '#f6efe3', '#c9973f', '#fff3d6'], amostra: ['#0c0a08', '#e2b866', '#9c6b2f', '#f6efe3'],
    txt: { revela: 'Os novos GCs', start: 'Revelar', badgeGc: 'Apresentamos', badgeCasal: 'Com alegria anunciamos', hint: 'Digite o nome de vocês e pressione Enter',
      ph: 'Nome do casal', p1: 'O casal', p2: 'Destino', mid: '&', match: 'Revelado', painel: 'Nossas novas famílias', prog: 'Casais que já descobriram seu GC', fechar: 'Enter para continuar', seta: '→' },
  },
  claro: {
    nome: 'Claro', desc: 'Fundo claro e limpo. Melhor para projetor em salão iluminado.',
    fx: null, mono: null, decode: false, pixel: false, wave: 'sine', tick: 1200,
    confete: ['#2f54eb', '#ff6b4a', '#11804c', '#f5b700', '#8f5cff'], amostra: ['#f3f5fa', '#2f54eb', '#ff6b4a', '#131a2c'],
    txt: { revela: 'Os novos GCs', start: 'Revelar', badgeGc: 'Novo GC', badgeCasal: 'Destino revelado', hint: 'Digite o nome de vocês e pressione Enter',
      ph: 'Nome do casal', p1: 'Casal', p2: 'Destino', mid: '→', match: 'Revelado!', painel: 'Nossas novas famílias', prog: 'Casais que já descobriram seu GC', fechar: 'Enter para continuar', seta: '→' },
  },
};
Object.keys(TEMAS).forEach(k => TEMAS[k].id = k);
const T = () => TEMAS[S?.evento?.tema] || TEMAS.matrix;
const col = g => T().mono || g.cor;

/* ================= banco (API local do aplicativo: SQLite + pasta de mídias) ================= */
async function api(metodo, url, corpo) {
  const json = corpo !== undefined && !(corpo instanceof FormData);
  const r = await fetch(url, { method: metodo, body: json ? JSON.stringify(corpo) : corpo, headers: { 'X-Cliente': CLIENTE, ...(json ? { 'Content-Type': 'application/json' } : {}) } });
  if (!r.ok) throw new Error(`${metodo} ${url}: ${r.status}`);
  return r.json();
}

const URLS = {}, TYPES = {};
async function loadMedia() {
  for (const k in URLS) delete URLS[k];
  for (const m of await api('GET', '/api/midia')) { URLS[m.id] = '/midia/' + m.id; TYPES[m.id] = m.tipo; }
}
async function dropMedia(id) {
  if (!id) return;
  await api('DELETE', '/api/midia/' + encodeURIComponent(id));
  delete URLS[id]; delete TYPES[id];
}
async function storeMedia(file) {
  const fd = new FormData(); fd.append('arquivo', file);
  const m = await api('POST', '/api/midia', fd);
  URLS[m.id] = '/midia/' + m.id; TYPES[m.id] = m.tipo;
  return m.id;
}

/* ================= estado ================= */
function demo() {
  const g = (id, nome, cor, lema, lids) => ({ id, nome, cor, lema, fotoId: null, videoId: null, lideres: lids.map(n => ({ nome: n, fotoId: null })) });
  const gcs = [
    g('g1', 'GC Raízes', '#FF4D6D', 'Arraigados e alicerçados em amor — Ef 3:17', ['Pedro e Ana Souza']),
    g('g2', 'GC Farol', '#22B8E8', 'Vós sois a luz do mundo — Mt 5:14', ['João e Marta Lima']),
    g('g3', 'GC Videira', '#2FBF71', 'Eu sou a videira, vós os ramos — Jo 15:5', ['Lucas e Bia Rocha']),
    g('g4', 'GC Âncora', '#9B5CFF', 'Esperança como âncora da alma — Hb 6:19', ['Tiago e Clara Melo']),
  ];
  const cs = [['Casal Calana', 'Kaio e Lana', 'g1'], ['Casal Oliveira', 'Rafa e Júlia', 'g2'], ['Casal Santos', 'Marcos e Lia', 'g3'],
    ['Casal Ferreira', 'Davi e Sara', 'g4'], ['Casal Almeida', 'Bruno e Carol', 'g1'], ['Casal Costa', 'Felipe e Nina', 'g2'],
    ['Casal Ribeiro', 'André e Paula', 'g3'], ['Casal Carvalho', 'Thiago e Bel', 'g4'], ['Casal Gomes', 'Igor e Duda', 'g1'],
    ['Casal Martins', 'Leo e Rute', 'g2'], ['Casal Araújo', 'Gabriel e Ester', 'g3'], ['Casal Barbosa', 'Caio e Lívia', 'g4']];
  return {
    evento: { nome: 'Multiplicação 2026', subtitulo: 'Um novo tempo, novas casas, a mesma família', logoId: null, tema: 'matrix', som: true, suspense: 3.5 },
    gcs,
    casais: cs.map(([nome, apelidos, gcId], i) => ({ id: 'c' + (i + 1), nome, apelidos, gcId, fotoId: null })),
    revelados: {},
    gcsRevelados: [],
  };
}
let S = null;
function fix(s) {
  const d = demo();
  s.evento = Object.assign({}, d.evento, s.evento || {});
  if (!TEMAS[s.evento.tema]) s.evento.tema = 'matrix';
  s.gcs = s.gcs || []; s.casais = s.casais || []; s.revelados = s.revelados || {}; s.gcsRevelados = s.gcsRevelados || [];
  s.gcs.forEach(g => g.lideres = g.lideres || []);
  return s;
}
let saveT;
function toast(txt, ms = 1500) {
  const el = $('#saveState'); el.textContent = txt; el.classList.remove('hidden');
  clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.add('hidden'), ms);
}
function save() {
  if (MODO === 'telao') return;
  clearTimeout(saveT);
  saveT = setTimeout(async () => {
    try { await api('PUT', '/api/config', S); if (screen === 'admin') toast('Salvo'); }
    catch (e) { toast('Não foi possível salvar: ' + e.message, 4000); }
  }, 250);
}
function setPath(path, val) {
  const ks = path.split('.'); let o = S;
  for (let i = 0; i < ks.length - 1; i++) o = o[ks[i]];
  o[ks[ks.length - 1]] = val;
}
function getPath(path) { return path.split('.').reduce((o, k) => o?.[k], S); }
const gcById = id => S.gcs.find(g => g.id === id);
function applyTheme() {
  document.documentElement.dataset.tema = S.evento.tema;
  fxStart();
}

/* ================= utilidades visuais ================= */
function initials(n) {
  return (n || '?').split(/\s+/).filter(w => w.length > 2 && !/^(casal|familia|família|gc)$/i.test(w)).slice(0, 2).map(w => w[0].toUpperCase()).join('') || '?';
}
function avatar(p, cls = '') {
  return p.fotoId && URLS[p.fotoId] ? `<img class="av ${cls}" src="${URLS[p.fotoId]}" alt="">` : `<div class="av ${cls}">${esc(initials(p.nome))}</div>`;
}
function frameInner(p) { return p.fotoId && URLS[p.fotoId] ? `<img src="${URLS[p.fotoId]}" alt="">` : `<span>${esc(initials(p.nome))}</span>`; }
function logoHTML() { const u = URLS[S.evento.logoId]; return u ? `<img class="logo" src="${u}" alt="">` : ''; }
function restartAnim(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
const flash = () => restartAnim($('#flash'), 'go');
const shake = el => restartAnim(el, 'shake');
const scramble = (str, keep, cs) => [...str].map((ch, i) => i < keep || ch === ' ' ? ch : cs[Math.random() * cs.length | 0]).join('');
async function decodeTo(el, final, ms, som = true) {
  const cs = T().charset || 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789', steps = Math.max(10, ms / 45 | 0);
  for (let s = 0; s <= steps; s++) {
    el.textContent = scramble(final, Math.floor(final.length * s / steps), cs);
    if (som && s % 2 === 0) sfx.tick();
    await sleep(ms / steps);
  }
  el.textContent = final;
}

/* fundo animado por tema */
const fx = $('#fx'), fc = fx.getContext('2d'); let fxRaf = 0;
const FX = {
  rain() {
    const sz = 16, cols = Math.ceil(fx.width / sz), drops = Array.from({ length: cols }, () => Math.random() * -60), cs = TEMAS.matrix.charset;
    let f = 0;
    fc.fillStyle = '#020703'; fc.fillRect(0, 0, fx.width, fx.height);
    return () => {
      if (++f % 3) return;
      fc.fillStyle = 'rgba(2,7,3,.14)'; fc.fillRect(0, 0, fx.width, fx.height);
      fc.font = `${sz}px "Share Tech Mono", monospace`;
      for (let i = 0; i < cols; i++) {
        const y = drops[i] * sz;
        fc.fillStyle = Math.random() < .04 ? '#e6ffee' : '#39ff7a';
        fc.fillText(cs[Math.random() * cs.length | 0], i * sz, y);
        if (y > fx.height && Math.random() > .975) drops[i] = 0;
        drops[i]++;
      }
    };
  },
  plexus() {
    const n = Math.min(90, (fx.width * fx.height) / 16000 | 0);
    const ps = Array.from({ length: n }, () => ({ x: Math.random() * fx.width, y: Math.random() * fx.height, vx: (Math.random() - .5) * .5, vy: (Math.random() - .5) * .5 }));
    return () => {
      fc.clearRect(0, 0, fx.width, fx.height);
      for (const p of ps) {
        p.x += p.vx; p.y += p.vy;
        if (p.x < 0 || p.x > fx.width) p.vx *= -1;
        if (p.y < 0 || p.y > fx.height) p.vy *= -1;
      }
      for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) {
        const a = ps[i], b = ps[j], d = Math.hypot(a.x - b.x, a.y - b.y);
        if (d < 140) { fc.strokeStyle = `rgba(60,200,255,${(1 - d / 140) * .45})`; fc.lineWidth = 1; fc.beginPath(); fc.moveTo(a.x, a.y); fc.lineTo(b.x, b.y); fc.stroke(); }
      }
      fc.fillStyle = '#7fdcff';
      for (const p of ps) { fc.beginPath(); fc.arc(p.x, p.y, 1.8, 0, 7); fc.fill(); }
    };
  },
  sparkle() {
    const n = 70, mk = () => ({ x: Math.random() * fx.width, y: fx.height + Math.random() * fx.height, r: .6 + Math.random() * 2.2, v: .2 + Math.random() * .6, t: Math.random() * 6 });
    const ps = Array.from({ length: n }, () => { const p = mk(); p.y = Math.random() * fx.height; return p; });
    return () => {
      fc.clearRect(0, 0, fx.width, fx.height);
      for (const p of ps) {
        p.y -= p.v; p.t += .03; p.x += Math.sin(p.t) * .2;
        if (p.y < -10) Object.assign(p, mk());
        const a = .35 + Math.sin(p.t * 2) * .3;
        const g = fc.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 4);
        g.addColorStop(0, `rgba(255,228,160,${a})`); g.addColorStop(1, 'rgba(226,184,102,0)');
        fc.fillStyle = g; fc.beginPath(); fc.arc(p.x, p.y, p.r * 4, 0, 7); fc.fill();
      }
    };
  },
};
function fxStart() {
  cancelAnimationFrame(fxRaf); fxRaf = 0;
  fx.width = innerWidth; fx.height = innerHeight;
  fc.clearRect(0, 0, fx.width, fx.height);
  const kind = T().fx;
  if (!kind || !document.body.classList.contains('palco')) return;
  const step = FX[kind]();

  const run = () => { step(); fxRaf = requestAnimationFrame(run); };
  run();
}

/* confete */
const cv = $('#confetti'), cx = cv.getContext('2d'); let parts = [], raf = 0;
function sizeCanvas() { const d = devicePixelRatio || 1; cv.width = innerWidth * d; cv.height = innerHeight * d; cx.setTransform(d, 0, 0, d, 0, 0); }
function confetti(extra) {
  sizeCanvas();
  const colors = [extra, ...T().confete], px = T().pixel;
  for (let i = 0; i < 240; i++) {
    const a = Math.random() * Math.PI * 2, v = 6 + Math.random() * 14;
    parts.push({ x: innerWidth / 2, y: innerHeight * .45, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 6, s: 5 + Math.random() * 7, r: Math.random() * 6, vr: (Math.random() - .5) * .3, c: colors[i % colors.length], px });
  }
  if (!raf) loop();
}
function loop() {
  cx.clearRect(0, 0, innerWidth, innerHeight);
  for (const p of parts) {
    p.vy += .35; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.r += p.vr;
    cx.fillStyle = p.c;
    if (p.px) cx.fillRect(Math.round(p.x / 4) * 4, Math.round(p.y / 4) * 4, p.s, p.s);
    else { cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); cx.restore(); }
  }
  parts = parts.filter(p => p.y < innerHeight + 40);
  raf = parts.length ? requestAnimationFrame(loop) : 0;
  if (!raf) cx.clearRect(0, 0, innerWidth, innerHeight);
}

let AC;
function ac() { if (!S.evento.som) return null; try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); AC.resume?.(); } catch (e) { return null; } return AC; }
function blip(freq, dur, at = 0, type = T().wave, vol = .08, slide) {
  const a = ac(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain(), t = a.currentTime + at;
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
  g.gain.setValueAtTime(type === 'square' ? vol : vol * 1.8, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + .02);
}

async function fotosLote(files) {
  let ok = 0; const sem = [];
  for (const f of files) {
    const q = norm(f.name.replace(/\.[^.]+$/, '').replace(/[_-]+/g, ' '));
    const best = S.casais.map(c => ({ c, s: score(q, c) })).sort((a, b) => b.s - a.s)[0];
    if (!best || best.s < .8) { sem.push(f.name); continue; }
    const id = await storeMedia(f);
    await dropMedia(best.c.fotoId);
    best.c.fotoId = id; ok++;
  }
  loteMsg = `${ok} foto(s) associada(s).` + (sem.length ? ` Sem casal correspondente: ${sem.join(', ')}.` : '');
  save(); renderAdmin();
}
function importCsv() {
  const lines = $('#csv').value.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  let n = 0, novos = 0;
  for (const l of lines) {
    const [nome, gcNome = '', apelidos = ''] = l.split(/;|\t/).map(s => s.trim());
    if (!nome) continue;
    let gc = gcNome ? S.gcs.find(g => norm(g.nome) === norm(gcNome)) : null;
    if (gcNome && !gc) {
      gc = { id: uid('g'), nome: gcNome, cor: hslToHex(`hsl(${Math.random() * 360 | 0} 75% 55%)`), lema: '', fotoId: null, videoId: null, lideres: [] };
      S.gcs.push(gc); novos++;
    }
    const ex = S.casais.find(c => norm(c.nome) === norm(nome));
    if (ex) { ex.gcId = gc?.id || ex.gcId; if (apelidos) ex.apelidos = apelidos; }
    else S.casais.push({ id: uid('c'), nome, apelidos, gcId: gc?.id || '', fotoId: null });
    n++;
  }
  save(); renderAdmin();
  $('#csvMsg').textContent = `${n} casais importados/atualizados${novos ? `, ${novos} GCs criados` : ''}.`;
}
function hslToHex(h) {
  const d = document.createElement('div'); d.style.color = h; document.body.appendChild(d);
  const m = getComputedStyle(d).color.match(/\d+/g); d.remove();
  return '#' + m.slice(0, 3).map(x => (+x).toString(16).padStart(2, '0')).join('');
}

const norm = s => (s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase()
  .replace(/\b(casal|familia|fam)\b/g, ' ').replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
function lev(a, b) {
  const m = a.length, n = b.length; if (!m || !n) return m || n;
  let p = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) {
    const c = [i];
    for (let j = 1; j <= n; j++) c[j] = Math.min(p[j] + 1, c[j - 1] + 1, p[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    p = c;
  }
  return p[n];
}
const sim = (a, b) => 1 - lev(a, b) / Math.max(a.length, b.length);
function score(q, c) {
  const terms = [c.nome, ...(c.apelidos || '').split(',')].map(norm).filter(Boolean);
  let best = 0;
  for (const t of terms) {
    if (t === q) return 1;
    if (q.length >= 3 && t.includes(q)) best = Math.max(best, .85);
    if (t.length >= 3 && q.includes(t)) best = Math.max(best, .8);
    best = Math.max(best, sim(q, t));
    for (const w of t.split(' ')) if (w.length >= 3) best = Math.max(best, sim(q, w) * .95);
  }
  return best;
}
function search(raw) {
  const q = norm(raw); if (!q) return [];
  return S.casais.filter(c => gcById(c.gcId)).map(c => ({ c, s: score(q, c) })).filter(x => x.s >= .72).sort((a, b) => b.s - a.s);
}

/* a animação é só suspense: termina sempre no GC já cadastrado para o casal */
async function versus(c, target) {
  const el = $('#vs'), mid = $('#vsMid'), slot = $('.vs-slot', el), gcEl = $('#vsGc'), x = T().txt, neutro = getComputedStyle(document.documentElement).getPropertyValue('--ac').trim();
  $('#vsT1').textContent = x.p1; $('#vsT2').textContent = x.p2;
  $('#vsPhoto').innerHTML = frameInner(c); $('#vsPhoto').style.setProperty('--fc', 'var(--tx)');
  $('#vsName').textContent = c.nome; gcEl.textContent = '???'; $('#vsLids').textContent = '';
  el.style.setProperty('--c', neutro); el.classList.remove('hidden', 'match');
  await sleep(350);
  for (const n of ['3', '2', '1']) { mid.textContent = n; restartAnim(mid, 'pop'); sfx.beep(); await sleep(700); }
  mid.textContent = x.mid; restartAnim(mid, 'pop'); sfx.go();
  const gs = S.gcs, L = gs.length, total = (S.evento.suspense || 3.5) * 1000;
  if (T().decode) {
    const cs = T().charset; let t = 0, k = 0;
    while (t < total * .55) { gcEl.textContent = scramble(gs[k++ % L].nome, 0, cs); sfx.tick(); await sleep(70); t += 70; }
    await decodeTo(gcEl, target.nome, total * .45);
    el.style.setProperty('--c', col(target));
  } else {
    const delays = []; let d = 50, t = 0;
    while (t < total) { delays.push(d); t += d; d *= 1.075; }
    const n = delays.length, ti = gs.indexOf(target), start = (((ti - (n - 1)) % L) + L) % L;
    for (let k = 0; k < n; k++) {
      const g = gs[(start + k) % L];
      gcEl.textContent = g.nome; el.style.setProperty('--c', col(g));
      sfx.tick(); await sleep(delays[k]);
    }
  }
  el.classList.add('match'); mid.textContent = x.match; restartAnim(mid, 'pop');
  $('#vsLids').textContent = target.lideres.map(l => l.nome).join(' · ');
  flash(); shake(slot); blip(1047, .5, 0, T().wave, .08);
  await sleep(1400);
  el.classList.add('hidden');
}

let statusTelao = null, statusEm = 0;
async function enviar(msg) {
  try { await api('POST', '/api/comando', { ...msg, origem: CLIENTE }); }
  catch (e) { toast('Não consegui falar com o telão: ' + e.message, 4000); }
}
function iniciarCanal() {
  const es = new EventSource('/api/eventos');
  es.onmessage = ev => receber(JSON.parse(ev.data));
  if (MODO === 'telao') {
    let ultimo = '', enviadoEm = 0;
    ac();
    setInterval(() => {
      const st = { tela: screen, ocupado: busy || !!vidDone, revelando: !$('#spot').classList.contains('hidden'), som: AC?.state || 'desligado' };
      const j = JSON.stringify(st);
      if (j !== ultimo || Date.now() - enviadoEm > 4000) { ultimo = j; enviadoEm = Date.now(); enviar({ tipo: 'status', ...st }); }
    }, 400);
  } else setInterval(atualizarStatus, 1500);
}
async function recarregarConfig() {
  const s = await api('GET', '/api/config'); if (!s) return;
  const temaAntes = S.evento.tema;
  S = fix(s); await loadMedia();
  if (S.evento.tema !== temaAntes) applyTheme();
  if (!busy && !vidDone && $('#spot').classList.contains('hidden')) go(screen);
}
function receber(m) {
  if (m.origem === CLIENTE) return;
  if (MODO === 'operador') {
    if (m.tipo === 'status') { statusTelao = m; statusEm = Date.now(); atualizarStatus(); }
    return;
  }
  const naTela = t => { if (screen !== t) go(t); };
  switch (m.tipo) {
    case 'config': recarregarConfig(); break;
    case 'tela': if (!busy) { if (!$('#spot').classList.contains('hidden')) closeSpot(); go(m.tela); } break;
    case 'revelarGc': if (!busy) { if (!$('#spot').classList.contains('hidden')) closeSpot(); naTela('revela'); revealGc(m.i); } break;
    case 'revelarCasal': if (!busy) {
      if (!$('#spot').classList.contains('hidden')) closeSpot();
      naTela('busca'); revealCasal(S.casais.find(c => c.id === m.id));
    } break;
    case 'digitando': if (!busy && $('#spot').classList.contains('hidden')) {
      naTela('busca'); const q = $('#q'); if (q) q.value = m.texto;
      $('#msg').textContent = ''; $('#choices').innerHTML = '';
    } break;
    case 'fechar': if (vidDone) vidDone(); else if (!$('#spot').classList.contains('hidden')) closeSpot(); break;
  }
}

  exemplo: {
    titulo: 'Dados de exemplo', desc: 'Troca tudo pelos 4 GCs e 12 casais fictícios, para ensaiar.', perigo: true,
    msg: 'Trocar tudo pelos dados de exemplo? GCs, casais, fotos, vídeos e logo atuais serão apagados. Não dá para desfazer: se tiver dúvida, exporte um backup antes.', ok: 'Dados de exemplo restaurados',
    fazer: async () => { await api('DELETE', '/api/midia'); await loadMedia(); const tema = S.evento.tema; S = demo(); S.evento.tema = tema; },
  },
};
function blocoReiniciar() {
  return `<div class="reset-grid">${Object.entries(REINICIOS).map(([k, r]) => `
    <button class="reset-card ${r.perigo ? 'perigo' : ''}" data-reset="${k}"><b>${r.titulo}</b><small>${r.desc}</small></button>`).join('')}</div>`;
}
async function reiniciar(k) {
  const r = REINICIOS[k];
  if (!r || !await ask(r.msg)) return;
  await r.fazer();
  if (MODO === 'operador') enviar({ tipo: 'fechar' });
  applyTheme(); save(); go(screen); toast(r.ok, 2500);
}
function desfazer(tipo, id) {
  if (tipo === 'casal') delete S.revelados[id];
  else S.gcsRevelados = S.gcsRevelados.filter(g => g !== id);
  save(); go(screen); toast('Revelação desfeita', 2000);
}
document.addEventListener('click', e => {
  const r = e.target.closest('[data-reset]'); if (r) return reiniciar(r.dataset.reset);
  const d = e.target.closest('[data-desfazer]'); if (d) desfazer(d.dataset.desfazer, d.dataset.id);
});

/* ================= teclado ================= */
const SCREENS = ['admin', 'revela', 'busca', 'painel'];
document.addEventListener('keydown', e => {
  if (MODO === 'operador') {
    if (e.key === 'Escape' && $('#ask').classList.contains('hidden') && !e.target.matches('input,textarea,select')) enviar({ tipo: 'fechar' });
    return;
  }
  if (e.altKey && /^Digit[1-4]$/.test(e.code)) { e.preventDefault(); return go(SCREENS[+e.code.slice(-1) - 1]); }
  if (!$('#ask').classList.contains('hidden')) return;
  if (vidDone) { if (['Enter', ' ', 'Escape'].includes(e.key)) { e.preventDefault(); vidDone(); } return; }
  if (!$('#spot').classList.contains('hidden')) { if (['Enter', ' ', 'Escape'].includes(e.key)) { e.preventDefault(); closeSpot(); } return; }
  if (busy || e.target.matches('input,textarea,select') || e.metaKey || e.ctrlKey) return;
  const k = e.key.toLowerCase();
  if (/^[1-4]$/.test(k)) { e.preventDefault(); return go(SCREENS[+k - 1]); }
  if (k === 't') { e.preventDefault(); const ks = Object.keys(TEMAS); return setTema(ks[(ks.indexOf(S.evento.tema) + 1) % ks.length]); }
  if (k === 'f') { if (window.pywebview?.api) window.pywebview.api.tela_cheia(); else document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.()?.catch(() => {}); return; }
  if (k === 'h') { document.body.classList.toggle('present'); return; }
  if (screen === 'revela' && (k === ' ' || k === 'arrowright')) { e.preventDefault(); revealNext(); }
  if (screen === 'revela' && k === 'r') resetRevela();
  if (screen === 'busca' && k !== 'escape') $('#q')?.focus();
});
addEventListener('resize', () => { sizeCanvas(); fxStart(); });

/* ================= início ================= */
(async () => {
  let s = null; try { s = await api('GET', '/api/config'); } catch (e) {}
  S = fix(s || demo());
  if (!s && MODO !== 'telao') try { await api('PUT', '/api/config', S); } catch (e) {}
  await loadMedia(); applyTheme();
  const h = location.hash.slice(1);
  if (MODO === 'operador') go(h === 'admin' ? 'admin' : 'controle');
  else if (MODO === 'telao') { document.body.classList.add('present'); go(['revela', 'busca', 'painel'].includes(h) ? h : 'revela'); }
  else go(SCREENS.includes(h) ? h : 'admin');
  if (MODO !== 'solo') iniciarCanal();
})();
</script>
</body>
</html>
